<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Mario Mind architecture. 16:9 for the demo video. Each block is a group (#step0 .. #step5) so it
       can be revealed one at a time in sync with the narration. Numbers in dashed chips are placeholders: fill them
       only with measured results. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1C2430" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F7F8FA"/>

  <g id="title">
    <text x="45" y="78" font-size="44" font-weight="700" fill="#1C2430">Mario Mind</text>
    <text x="45" y="120" font-size="24" fill="#5B6573">An agent that reasons, plays like a person, and predicts that person's brain</text>
  </g>

  <!-- 0: input -->
  <g id="step0">
    <rect x="45" y="180" width="270" height="86" rx="14" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="2" filter="url(#shadow)"/>
    <rect x="65" y="198" width="66" height="50" rx="6" fill="#5C94FC"/>
    <rect x="65" y="232" width="66" height="16" rx="0" fill="#C84C0C"/>
    <rect x="92" y="214" width="12" height="18" rx="2" fill="#B53120"/>
    <text x="146" y="217" font-size="21" font-weight="600" fill="#1C2430">Game screen</text>
    <text x="146" y="244" font-size="18" fill="#5B6573">Super Mario Bros.</text>
    <line x1="180" y1="266" x2="180" y2="322" stroke="#5B6573" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- 1: Glimmer -->
  <g id="step1">
    <rect x="45" y="330" width="270" height="320" rx="18" fill="#FFFFFF" stroke="#4C6EF5" stroke-width="3" filter="url(#shadow)"/>
    <rect x="45" y="330" width="270" height="10" rx="5" fill="#4C6EF5"/>
    <text x="70" y="384" font-size="22" font-weight="700" fill="#4C6EF5">1</text>
    <text x="96" y="384" font-size="26" font-weight="700" fill="#1C2430">Glimmer 30B</text>
    <text x="70" y="430" font-size="20" fill="#2E3846">Meta's vision-language</text>
    <text x="70" y="456" font-size="20" fill="#2E3846">model sees the screen</text>
    <text x="70" y="482" font-size="20" fill="#2E3846">and the last 8 turns,</text>
    <text x="70" y="508" font-size="20" fill="#2E3846">then reasons in words</text>
    <rect x="70" y="540" width="220" height="82" rx="10" fill="#EDF2FF"/>
    <text x="84" y="570" font-size="17" fill="#364FC7" font-style="italic">"A Goomba is ahead,</text>
    <text x="84" y="594" font-size="17" fill="#364FC7" font-style="italic">so jump: right + A"</text>
    <line x1="315" y1="490" x2="355" y2="490" stroke="#5B6573" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- 2: VLA-JEPA -->
  <g id="step2">
    <rect x="363" y="330" width="270" height="320" rx="18" fill="#FFFFFF" stroke="#7048E8" stroke-width="3" filter="url(#shadow)"/>
    <rect x="363" y="330" width="270" height="10" rx="5" fill="#7048E8"/>
    <text x="388" y="384" font-size="22" font-weight="700" fill="#7048E8">2</text>
    <text x="414" y="384" font-size="26" font-weight="700" fill="#1C2430">VLA-JEPA</text>
    <text x="388" y="430" font-size="20" fill="#2E3846">8 latent action tokens</text>
    <text x="388" y="456" font-size="20" fill="#2E3846">feed a world model that</text>
    <text x="388" y="482" font-size="20" fill="#2E3846">predicts the future in</text>
    <text x="388" y="508" font-size="20" fill="#2E3846">V-JEPA 2.1 space</text>
    <g font-size="17" font-weight="600" fill="#5F3DC4">
      <rect x="388" y="530" width="66" height="30" rx="15" fill="#F3F0FF"/><text x="421" y="551" text-anchor="middle">+0.5 s</text>
      <rect x="462" y="530" width="66" height="30" rx="15" fill="#F3F0FF"/><text x="495" y="551" text-anchor="middle">+1 s</text>
      <rect x="536" y="530" width="66" height="30" rx="15" fill="#F3F0FF"/><text x="569" y="551" text-anchor="middle">+2 s</text>
    </g>
    <rect x="388" y="576" width="220" height="56" rx="10" fill="#F8F0FC" stroke="#AE3EC9" stroke-width="1.5"/>
    <text x="400" y="600" font-size="16" font-weight="600" fill="#862E9C">+ language loss on its own</text>
    <text x="400" y="621" font-size="16" font-weight="600" fill="#862E9C">reasoning, balanced 1 : 1</text>
    <line x1="633" y1="490" x2="673" y2="490" stroke="#5B6573" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- 3: SFT on human play -->
  <g id="step3">
    <rect x="681" y="330" width="270" height="320" rx="18" fill="#FFFFFF" stroke="#0CA678" stroke-width="3" filter="url(#shadow)"/>
    <rect x="681" y="330" width="270" height="10" rx="5" fill="#0CA678"/>
    <text x="706" y="384" font-size="22" font-weight="700" fill="#0CA678">3</text>
    <text x="732" y="384" font-size="26" font-weight="700" fill="#1C2430">SFT</text>
    <text x="706" y="430" font-size="20" fill="#2E3846">Learns from 5 human</text>
    <text x="706" y="456" font-size="20" fill="#2E3846">players (CNeuroMod):</text>
    <text x="706" y="482" font-size="20" fill="#2E3846">reason first, then press</text>
    <text x="706" y="508" font-size="20" fill="#2E3846">the button they pressed</text>
    <g font-size="17" font-weight="600" fill="#087F5B">
      <rect x="706" y="540" width="104" height="30" rx="15" fill="#E6FCF5"/><text x="758" y="561" text-anchor="middle">reasoning</text>
      <text x="822" y="561" font-size="20" fill="#5B6573">→</text>
      <rect x="844" y="540" width="82" height="30" rx="15" fill="#E6FCF5"/><text x="885" y="561" text-anchor="middle">button</text>
    </g>
    <line x1="951" y1="490" x2="991" y2="490" stroke="#5B6573" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- 4: RL -->
  <g id="step4">
    <rect x="999" y="330" width="270" height="320" rx="18" fill="#FFFFFF" stroke="#F08C00" stroke-width="3" filter="url(#shadow)"/>
    <rect x="999" y="330" width="270" height="10" rx="5" fill="#F08C00"/>
    <text x="1024" y="384" font-size="22" font-weight="700" fill="#F08C00">4</text>
    <text x="1050" y="384" font-size="26" font-weight="700" fill="#1C2430">RL · GAIL</text>
    <text x="1024" y="430" font-size="20" fill="#2E3846">Plays the game itself;</text>
    <text x="1024" y="456" font-size="20" fill="#2E3846">a discriminator rewards</text>
    <text x="1024" y="482" font-size="20" fill="#2E3846">play that looks like</text>
    <text x="1024" y="508" font-size="20" fill="#2E3846">one person: sub-03</text>
    <g font-size="17" font-weight="600" fill="#D9480F">
      <rect x="1024" y="540" width="220" height="30" rx="15" fill="#FFF4E6"/><text x="1134" y="561" text-anchor="middle">plays like sub-03</text>
    </g>
    <line x1="1269" y1="490" x2="1309" y2="490" stroke="#5B6573" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- 5: brain -->
  <g id="step5">
    <rect x="1317" y="330" width="238" height="320" rx="18" fill="#FFFFFF" stroke="#E64980" stroke-width="3" filter="url(#shadow)"/>
    <rect x="1317" y="330" width="238" height="10" rx="5" fill="#E64980"/>
    <text x="1342" y="384" font-size="22" font-weight="700" fill="#E64980">5</text>
    <text x="1368" y="384" font-size="26" font-weight="700" fill="#1C2430">Brain</text>
    <text x="1342" y="430" font-size="20" fill="#2E3846">The agent's internal</text>
    <text x="1342" y="456" font-size="20" fill="#2E3846">states predict the</text>
    <text x="1342" y="482" font-size="20" fill="#2E3846">fMRI of sub-03, on</text>
    <text x="1342" y="508" font-size="20" fill="#2E3846">sessions never seen</text>
    <g font-size="17" font-weight="600" fill="#C2255C">
      <rect x="1342" y="540" width="188" height="30" rx="15" fill="#FFF0F6"/><text x="1436" y="561" text-anchor="middle">+ danger response</text>
    </g>
  </g>

  <!-- measured numbers: placeholders until the results exist -->
  <g id="numbers" font-size="17" fill="#5B6573">
    <rect x="363" y="676" width="270" height="56" rx="10" fill="none" stroke="#7048E8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="498" y="700" text-anchor="middle">prediction R² of the change</text>
    <text x="498" y="722" text-anchor="middle" font-weight="700" fill="#7048E8">[measured Nov 3]</text>
    <rect x="681" y="676" width="270" height="56" rx="10" fill="none" stroke="#0CA678" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="816" y="700" text-anchor="middle">button match vs copy baseline</text>
    <text x="816" y="722" text-anchor="middle" font-weight="700" fill="#0CA678">[measured]</text>
    <rect x="999" y="676" width="270" height="56" rx="10" fill="none" stroke="#F08C00" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1134" y="700" text-anchor="middle">human-likeness to sub-03</text>
    <text x="1134" y="722" text-anchor="middle" font-weight="700" fill="#F08C00">[measured]</text>
    <rect x="1317" y="676" width="238" height="56" rx="10" fill="none" stroke="#E64980" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1436" y="700" text-anchor="middle">brain prediction</text>
    <text x="1436" y="722" text-anchor="middle" font-weight="700" fill="#E64980">[measured]</text>
  </g>

  <g id="footer">
    <line x1="45" y1="790" x2="1555" y2="790" stroke="#DDE1E6" stroke-width="2"/>
    <text x="45" y="830" font-size="18" fill="#7A8491">Data: CNeuroMod Super Mario Bros. (5 players, fMRI of sub-03) · Models: Muse Glimmer 30B, V-JEPA 2.1</text>
  </g>
</svg>
