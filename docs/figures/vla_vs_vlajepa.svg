<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="800" viewBox="0 0 1640 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d3fd9"/>
    </marker>
    <g id="screen">
      <rect x="0" y="0" width="120" height="84" rx="8" fill="#5c94fc"/>
      <rect x="0" y="62" width="120" height="22" fill="#c84c0c"/>
      <rect x="0" y="62" width="120" height="5" fill="#e09050"/>
      <rect x="22" y="38" width="14" height="24" rx="2" fill="#d03a2a"/>
      <rect x="20" y="34" width="18" height="8" rx="2" fill="#d03a2a"/>
      <ellipse cx="88" cy="57" rx="13" ry="7" fill="#8b4a1c"/>
      <rect x="70" y="10" width="20" height="20" rx="2" fill="#f0a030" stroke="#8b4a1c" stroke-width="2"/>
      <text x="80" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#8b4a1c">?</text>
    </g>
  </defs>
  <rect width="1640" height="800" fill="#ffffff"/>

  <!-- LEFT: traditional VLA -->
  <rect x="20" y="20" width="560" height="760" rx="22" fill="#f4f5f7"/>
  <text x="50" y="68" font-size="34" font-weight="700" fill="#1f232b">Traditional VLA</text>
  <text x="50" y="102" font-size="20" fill="#5f6670">vision-language-action model (e.g. RT-2, OpenVLA)</text>

  <use href="#screen" x="90" y="150"/>
  <text x="150" y="262" font-size="18" text-anchor="middle" fill="#5f6670">screen</text>
  <rect x="300" y="160" width="220" height="64" rx="12" fill="#ffffff" stroke="#c9ced6" stroke-width="2"/>
  <text x="410" y="199" font-size="19" text-anchor="middle" fill="#1f232b">task / prompt</text>
  <line x1="150" y1="276" x2="270" y2="330" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="410" y1="232" x2="330" y2="330" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="120" y="340" width="360" height="96" rx="16" fill="#ffffff" stroke="#4a6cf0" stroke-width="3"/>
  <text x="300" y="382" font-size="24" font-weight="700" text-anchor="middle" fill="#1f232b">Vision-language model</text>
  <text x="300" y="414" font-size="18" text-anchor="middle" fill="#5f6670">fine-tuned to output actions</text>
  <line x1="300" y1="440" x2="300" y2="498" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="180" y="506" width="240" height="64" rx="32" fill="#e6f6ee" stroke="#0e8a5f" stroke-width="2"/>
  <text x="300" y="546" font-size="22" font-weight="700" text-anchor="middle" fill="#0e8a5f">right + A</text>

  <text x="60" y="636" font-size="21" fill="#1f232b">Learns one mapping: screen → button</text>
  <text x="60" y="676" font-size="21" fill="#c0392b">✗  no idea what comes next</text>
  <text x="60" y="712" font-size="21" fill="#c0392b">✗  says nothing about why</text>

  <!-- RIGHT: VLA-JEPA -->
  <rect x="600" y="20" width="1020" height="760" rx="22" fill="#f6f2fe"/>
  <text x="630" y="68" font-size="34" font-weight="700" fill="#1f232b">VLA-JEPA <tspan font-size="24" font-weight="400" fill="#6d3fd9">(ours)</tspan></text>
  <text x="630" y="102" font-size="20" fill="#5f6670">the same model also learns to anticipate, in V-JEPA's latent space</text>

  <use href="#screen" x="650" y="150"/>
  <text x="710" y="262" font-size="18" text-anchor="middle" fill="#5f6670">screen + last 2 s</text>
  <line x1="710" y1="276" x2="760" y2="334" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="640" y="340" width="300" height="96" rx="16" fill="#ffffff" stroke="#4a6cf0" stroke-width="3"/>
  <text x="790" y="382" font-size="24" font-weight="700" text-anchor="middle" fill="#1f232b">Glimmer</text>
  <text x="790" y="414" font-size="18" text-anchor="middle" fill="#5f6670">vision-language model</text>

  <!-- words + action branch -->
  <line x1="790" y1="440" x2="790" y2="490" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="640" y="498" width="300" height="92" rx="14" fill="#eaf0ff"/>
  <text x="660" y="532" font-size="18" font-style="italic" fill="#3b56c8">"A Goomba is ahead,</text>
  <text x="660" y="558" font-size="18" font-style="italic" fill="#3b56c8">so jump now"</text>
  <text x="660" y="580" font-size="14" fill="#5f6670">its reasoning, in words</text>
  <line x1="790" y1="594" x2="790" y2="632" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="670" y="640" width="240" height="64" rx="32" fill="#e6f6ee" stroke="#0e8a5f" stroke-width="2"/>
  <text x="790" y="680" font-size="22" font-weight="700" text-anchor="middle" fill="#0e8a5f">right + A</text>

  <!-- latent / world model branch -->
  <line x1="944" y1="388" x2="1000" y2="388" stroke="#6d3fd9" stroke-width="3" marker-end="url(#arp)"/>
  <g>
    <rect x="1008" y="356" width="26" height="64" rx="6" fill="#b9a4f2"/>
    <rect x="1040" y="356" width="26" height="64" rx="6" fill="#b9a4f2"/>
    <rect x="1072" y="356" width="26" height="64" rx="6" fill="#b9a4f2"/>
  </g>
  <text x="1053" y="446" font-size="16" text-anchor="middle" fill="#6d3fd9">latent tokens</text>
  <line x1="1104" y1="388" x2="1160" y2="388" stroke="#6d3fd9" stroke-width="3" marker-end="url(#arp)"/>
  <rect x="1168" y="340" width="190" height="96" rx="16" fill="#ffffff" stroke="#6d3fd9" stroke-width="3"/>
  <text x="1263" y="382" font-size="22" font-weight="700" text-anchor="middle" fill="#1f232b">World model</text>
  <text x="1263" y="412" font-size="16" text-anchor="middle" fill="#5f6670">small network</text>
  <line x1="1362" y1="388" x2="1410" y2="388" stroke="#6d3fd9" stroke-width="3" marker-end="url(#arp)"/>
  <rect x="1418" y="330" width="180" height="116" rx="14" fill="#ffffff" stroke="#6d3fd9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1508" y="366" font-size="18" font-weight="700" text-anchor="middle" fill="#6d3fd9">its guess</text>
  <text x="1508" y="394" font-size="16" text-anchor="middle" fill="#1f232b">V-JEPA features</text>
  <text x="1508" y="420" font-size="16" text-anchor="middle" fill="#1f232b">+0.5 s · +1 s · +2 s</text>

  <rect x="1418" y="150" width="180" height="96" rx="14" fill="#e8f1fb" stroke="#1d7fd6" stroke-width="2"/>
  <text x="1508" y="186" font-size="18" font-weight="700" text-anchor="middle" fill="#1d7fd6">V-JEPA 2.1</text>
  <text x="1508" y="212" font-size="16" text-anchor="middle" fill="#1f232b">features of what</text>
  <text x="1508" y="234" font-size="16" text-anchor="middle" fill="#1f232b">really came next</text>
  <line x1="1508" y1="252" x2="1508" y2="322" stroke="#1d7fd6" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="1508" cy="288" r="22" fill="#ffffff" stroke="#1d7fd6" stroke-width="2"/>
  <text x="1508" y="295" font-size="20" font-weight="700" text-anchor="middle" fill="#1d7fd6">≈?</text>
  <text x="1380" y="294" font-size="16" text-anchor="end" fill="#5f6670">prediction error</text>
  <text x="1380" y="314" font-size="16" text-anchor="end" fill="#5f6670">trains Glimmer</text>

  <text x="980" y="550" font-size="21" fill="#0e8a5f">✓  anticipates: predicts the next 2 s</text>
  <text x="980" y="588" font-size="21" fill="#0e8a5f">✓  explains why, in words</text>
  <text x="980" y="626" font-size="21" fill="#0e8a5f">✓  acts</text>
  <rect x="970" y="664" width="620" height="88" rx="14" fill="#ffffff"/>
  <text x="990" y="700" font-size="18" fill="#1f232b"><tspan font-weight="700">JEPA idea:</tspan> predict the future in a learned embedding</text>
  <text x="990" y="728" font-size="18" fill="#1f232b">space (V-JEPA's), not in pixels: what matters, not every detail</text>
</svg>
