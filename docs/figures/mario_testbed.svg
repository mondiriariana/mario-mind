<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="800" viewBox="0 0 1640 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/>
    </marker>
    <g id="screen">
      <rect x="0" y="0" width="240" height="168" rx="12" fill="#5c94fc"/>
      <rect x="0" y="124" width="240" height="44" fill="#c84c0c"/>
      <rect x="0" y="124" width="240" height="9" fill="#e09050"/>
      <rect x="44" y="66" width="34" height="10" rx="4" fill="#d03a2a"/>
      <rect x="40" y="72" width="16" height="5" rx="2" fill="#d03a2a"/>
      <rect x="47" y="76" width="28" height="16" rx="3" fill="#f2c9a0"/>
      <circle cx="68" cy="83" r="2.5" fill="#1f232b"/>
      <rect x="45" y="92" width="32" height="14" rx="3" fill="#d03a2a"/>
      <rect x="47" y="104" width="28" height="12" rx="2" fill="#2f5fd0"/>
      <rect x="47" y="116" width="11" height="8" fill="#2f5fd0"/>
      <rect x="64" y="116" width="11" height="8" fill="#2f5fd0"/>
      <ellipse cx="176" cy="114" rx="24" ry="13" fill="#8b4a1c"/>
      <rect x="140" y="22" width="38" height="38" rx="3" fill="#f0a030" stroke="#8b4a1c" stroke-width="3"/>
      <text x="159" y="52" font-size="28" font-weight="700" text-anchor="middle" fill="#8b4a1c">?</text>
      <rect x="200" y="84" width="34" height="40" rx="3" fill="#2a9d3a"/>
      <rect x="194" y="76" width="46" height="14" rx="3" fill="#2a9d3a"/>
    </g>
  </defs>
  <rect width="1640" height="800" fill="#ffffff"/>

  <!-- the person -->
  <rect x="20" y="20" width="500" height="760" rx="22" fill="#f4f5f7"/>
  <text x="50" y="68" font-size="30" font-weight="700" fill="#1f232b">A person in the scanner</text>
  <text x="50" y="100" font-size="19" fill="#5f6670">CNeuroMod Super Mario Bros.</text>
  <!-- scanner cartoon -->
  <rect x="90" y="140" width="360" height="200" rx="100" fill="#dfe3ea"/>
  <circle cx="270" cy="240" r="72" fill="#ffffff"/>
  <circle cx="270" cy="240" r="40" fill="#f2c9a0"/>
  <circle cx="257" cy="234" r="4" fill="#1f232b"/>
  <circle cx="283" cy="234" r="4" fill="#1f232b"/>
  <path d="M258 252 Q270 260 282 252" stroke="#1f232b" stroke-width="3" fill="none"/>
  <text x="270" y="374" font-size="17" text-anchor="middle" fill="#5f6670">fMRI of the whole brain</text>
  <text x="50" y="440" font-size="20" fill="#1f232b">•  5 people, 20–30 sessions each</text>
  <text x="50" y="476" font-size="20" fill="#1f232b">•  every button press recorded</text>
  <text x="50" y="512" font-size="20" fill="#1f232b">•  fast, natural decisions:</text>
  <text x="74" y="540" font-size="20" fill="#1f232b">enemies, gaps, timing</text>
  <rect x="50" y="590" width="440" height="150" rx="16" fill="#ffffff"/>
  <text x="70" y="628" font-size="18" fill="#1f232b">Behavior and brain for the</text>
  <text x="70" y="654" font-size="18" fill="#1f232b">same moments: rare to have both.</text>
  <text x="70" y="694" font-size="18" fill="#5f6670">Mario is the testbed; the recipe</text>
  <text x="70" y="720" font-size="18" fill="#5f6670">is not specific to it.</text>

  <!-- the same screen -->
  <use href="#screen" x="590" y="250"/>
  <text x="710" y="452" font-size="19" font-weight="700" text-anchor="middle" fill="#1f232b">the same screen</text>
  <text x="710" y="478" font-size="17" text-anchor="middle" fill="#5f6670">(their frames)</text>
  <line x1="524" y1="334" x2="580" y2="334" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="836" y1="334" x2="892" y2="334" stroke="#5b6270" stroke-width="3" marker-end="url(#ar)"/>

  <!-- the agent -->
  <rect x="900" y="20" width="720" height="760" rx="22" fill="#f6f2fe"/>
  <text x="930" y="68" font-size="30" font-weight="700" fill="#1f232b">Our agent at that moment</text>
  <text x="930" y="100" font-size="19" fill="#5f6670">sees what they saw, never what they did next</text>
  <rect x="930" y="130" width="660" height="270" rx="16" fill="#ffffff" stroke="#6d3fd9" stroke-width="2.5"/>
  <text x="954" y="170" font-size="17" font-weight="700" fill="#6d3fd9">&lt;perception&gt;</text>
  <text x="954" y="198" font-size="18" font-style="italic" fill="#1f232b">Mario is on the ground; a Goomba is walking toward him,</text>
  <text x="954" y="222" font-size="18" font-style="italic" fill="#1f232b">a ? block is above, a pipe further right.</text>
  <text x="954" y="262" font-size="17" font-weight="700" fill="#6d3fd9">&lt;reasoning&gt;</text>
  <text x="954" y="290" font-size="18" font-style="italic" fill="#1f232b">The Goomba will reach him in about a second. Jumping now</text>
  <text x="954" y="314" font-size="18" font-style="italic" fill="#1f232b">clears it and hits the block.</text>
  <text x="954" y="354" font-size="17" font-weight="700" fill="#6d3fd9">&lt;answer&gt;</text>
  <rect x="1060" y="332" width="170" height="40" rx="20" fill="#e6f6ee" stroke="#0e8a5f" stroke-width="2"/>
  <text x="1145" y="359" font-size="19" font-weight="700" text-anchor="middle" fill="#0e8a5f">right + A</text>
  <text x="1250" y="359" font-size="15" fill="#5f6670">(illustration)</text>

  <text x="930" y="456" font-size="22" font-weight="700" fill="#1f232b">Then we ask two questions</text>
  <rect x="930" y="480" width="320" height="200" rx="16" fill="#ffffff"/>
  <text x="954" y="522" font-size="21" font-weight="700" fill="#0e8a5f">Acts like them?</text>
  <text x="954" y="558" font-size="18" fill="#1f232b">its buttons vs the</text>
  <text x="954" y="582" font-size="18" fill="#1f232b">person's, on play it</text>
  <text x="954" y="606" font-size="18" fill="#1f232b">never trained on</text>
  <rect x="1270" y="480" width="320" height="200" rx="16" fill="#ffffff"/>
  <text x="1294" y="522" font-size="21" font-weight="700" fill="#d6336c">Thinks like them?</text>
  <text x="1294" y="558" font-size="18" fill="#1f232b">its hidden states →</text>
  <text x="1294" y="582" font-size="18" fill="#1f232b">their fMRI, on sessions</text>
  <text x="1294" y="606" font-size="18" fill="#1f232b">it never saw; e.g. do</text>
  <text x="1294" y="630" font-size="18" fill="#1f232b">its "danger" moments</text>
  <text x="1294" y="654" font-size="18" fill="#1f232b">match the brain's?</text>
</svg>
